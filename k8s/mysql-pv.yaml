apiVersion: v1
kind: PersistentVolume
metadata:
  name: mysql-pv

spec:
  capacity:
    storage: 2Gi

  volumeMode: Filesystem

  accessModes:
    - ReadWriteOnce

  persistentVolumeReclaimPolicy: Retain

  storageClassName: ""

  hostPath:
    path: /data/guestbook/mysql
    type: Directory

  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - guestbook-m02
