apiVersion: v1
kind: Namespace
metadata:
  name: mlops-task
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-deployment
  namespace: mlops-task
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hello-app
  template:
    metadata:
      labels:
        app: hello-app
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: hello-app

      initContainers:
        - name: init-done
          image: busybox:1.36
          command:
            - sh
            - -c
            - echo "Initialization completed"; sleep 1

      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          command:
            - /bin/sh
            - -c
          args:
            - |
              cat > /etc/nginx/conf.d/default.conf <<'NGINX'
              server {
                  listen 80;
                  location / {
                      proxy_pass http://127.0.0.1:8080;
                  }
              }
              NGINX
              exec nginx -g 'daemon off;'
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10

        - name: time-updater
          image: python:3.12-alpine
          command:
            - python
            - -u
            - -c
          args:
            - |
              from http.server import BaseHTTPRequestHandler, HTTPServer
              from datetime import datetime, timezone
              import threading
              import time

              state = {"timestamp": ""}

              def update_time():
                  while True:
                      state["timestamp"] = datetime.now(timezone.utc).isoformat()
                      time.sleep(5)

              class Handler(BaseHTTPRequestHandler):
                  def do_GET(self):
                      if self.path == "/healthz":
                          body = b"OK"
                          content_type = "text/plain"
                      else:
                          html = f"""
                          <!DOCTYPE html>
                          <html>
                          <head>
                              <title>Kubernetes Task 1</title>
                              <meta charset="UTF-8">
                          </head>
                          <body>
                              <h1>Hello in MLOPS MENA COMMUNITY</h1>
                              <h2>Current UTC Timestamp</h2>
                              <p>{state['timestamp']}</p>
                          </body>
                          </html>
                          """
                          body = html.encode()
                          content_type = "text/html; charset=utf-8"

                      self.send_response(200)
                      self.send_header("Content-Type", content_type)
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)

                  def log_message(self, *args):
                      pass

              threading.Thread(target=update_time, daemon=True).start()
              HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: hello-service
  namespace: mlops-task
spec:
  type: NodePort
  selector:
    app: hello-app
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
